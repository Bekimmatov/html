<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elektron Kutubxona</title>
    <!-- Tailwind CSS ulash -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome iconkalari -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f3f4f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        .truncate-2-lines {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>
<body class="text-gray-800">

    <!-- Header -->
    <header class="bg-indigo-600 text-white shadow-lg sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center">
            <h1 class="text-2xl md:text-3xl font-bold flex items-center mb-4 md:mb-0">
                <i class="fa-solid fa-book-open mr-3"></i> Geografiya Kutubxonasi
            </h1>
            <div class="w-full md:w-1/3 relative">
                <input type="text" id="searchInput" placeholder="Kitob yoki toifa qidirish..." 
                    class="w-full px-4 py-2 rounded-full text-gray-800 focus:outline-none focus:ring-2 focus:ring-indigo-300 transition pl-10">
                <i class="fa-solid fa-search absolute left-4 top-3 text-gray-400"></i>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8 flex flex-col md:flex-row gap-6">
        
        <!-- Sidebar: Categories -->
        <aside class="w-full md:w-1/4">
            <div class="bg-white rounded-lg shadow-md p-4 sticky top-24">
                <h2 class="text-xl font-semibold border-b pb-2 mb-4 text-indigo-700">
                    <i class="fa-solid fa-layer-group mr-2"></i> Toifalar
                </h2>
                <ul id="categoryList" class="space-y-2 max-h-96 overflow-y-auto pr-2 custom-scrollbar">
                    <li>
                        <button class="category-btn active w-full text-left px-3 py-2 rounded bg-indigo-100 text-indigo-700 font-medium transition" data-category="Barchasi">
                            Barchasi <span id="totalCount" class="float-right bg-indigo-200 text-indigo-800 py-0.5 px-2 rounded-full text-xs">0</span>
                        </button>
                    </li>
                    <!-- Toifalar JavaScript orqali shu yerga qo'shiladi -->
                </ul>
            </div>
        </aside>

        <!-- Books Grid -->
        <section class="w-full md:w-3/4">
            <div class="mb-4 flex justify-between items-center">
                <h2 id="currentCategoryTitle" class="text-2xl font-bold text-gray-700">Barcha kitoblar</h2>
                <span id="resultsCount" class="text-sm text-gray-500 font-medium">0 ta natija</span>
            </div>
            
            <div id="booksGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Yuklanmoqda animatsiyasi -->
                <div class="col-span-full flex justify-center py-12">
                    <i class="fa-solid fa-circle-notch fa-spin text-4xl text-indigo-500"></i>
                </div>
            </div>
            
            <!-- Xato/Bo'sh holat -->
            <div id="emptyState" class="hidden flex flex-col items-center justify-center py-16 text-gray-500">
                <i class="fa-solid fa-folder-open text-6xl mb-4 text-gray-300"></i>
                <p class="text-lg">Hech qanday ma'lumot topilmadi.</p>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white text-center py-6 mt-auto">
        <p>&copy; <span id="year"></span> Elektron Kutubxona. Barcha huquqlar himoyalangan.</p>
    </footer>

    <!-- JavaScript -->
    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        let allBooks = [];
        let categories = {};
        let currentCategory = 'Barchasi';

        // GitHub xom havolasini ishlatish
        const jsonFileUrl = 'https://raw.githubusercontent.com/Bekimmatov/html/refs/heads/main/kutubxona/data_export_2026-03-22_13-44.json';

        // Ma'lumotlarni yuklash
        async function fetchBooks() {
            try {
                const response = await fetch(jsonFileUrl);
                if (!response.ok) throw new Error("Faylni yuklab bo'lmadi");
                
                allBooks = await response.json();
                processCategories();
                renderCategories();
                renderBooks(allBooks);
            } catch (error) {
                console.error("Xatolik:", error);
                document.getElementById('booksGrid').innerHTML = `
                    <div class="col-span-full text-center text-red-500 py-8">
                        <i class="fa-solid fa-triangle-exclamation text-4xl mb-2"></i>
                        <p>Ma'lumotlarni yuklashda xatolik yuz berdi. Iltimos JSON fayl mavjudligini tekshiring.</p>
                    </div>`;
            }
        }

        // Toifalarni sanash va yig'ish
        function processCategories() {
            categories = {};
            allBooks.forEach(book => {
                const cat = book.folder || "Boshqa";
                if (!categories[cat]) categories[cat] = 0;
                categories[cat]++;
            });
            document.getElementById('totalCount').textContent = allBooks.length;
        }

        // Toifalar ro'yxatini UI ga chizish
        function renderCategories() {
            const list = document.getElementById('categoryList');
            // Sort categories by name alphabetically
            const sortedKeys = Object.keys(categories).sort();
            
            sortedKeys.forEach(cat => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <button class="category-btn w-full text-left px-3 py-2 rounded hover:bg-gray-100 text-gray-700 transition flex justify-between items-center" data-category="${cat}">
                        <span class="truncate w-4/5" title="${cat}">${cat}</span>
                        <span class="bg-gray-200 text-gray-600 py-0.5 px-2 rounded-full text-xs">${categories[cat]}</span>
                    </button>
                `;
                list.appendChild(li);
            });

            // Toifa bosilganda ishlaydigan hodisalar
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    // Faol klassni o'zgartirish
                    document.querySelectorAll('.category-btn').forEach(b => {
                        b.classList.remove('bg-indigo-100', 'text-indigo-700', 'font-medium', 'active');
                        b.classList.add('hover:bg-gray-100', 'text-gray-700');
                    });
                    
                    const clickedBtn = e.currentTarget;
                    clickedBtn.classList.add('bg-indigo-100', 'text-indigo-700', 'font-medium', 'active');
                    clickedBtn.classList.remove('hover:bg-gray-100', 'text-gray-700');

                    currentCategory = clickedBtn.getAttribute('data-category');
                    document.getElementById('currentCategoryTitle').textContent = currentCategory === 'Barchasi' ? 'Barcha kitoblar' : currentCategory;
                    
                    filterBooks();
                });
            });
        }

        // Kitoblarni UI ga chizish
        function renderBooks(books) {
            const grid = document.getElementById('booksGrid');
            const emptyState = document.getElementById('emptyState');
            document.getElementById('resultsCount').textContent = \
 `${books.length} ta natija`;
            grid.innerHTML = '';

            if (books.length === 0) {
                grid.classList.add('hidden');
                emptyState.classList.remove('hidden');
                return;
            }

            grid.classList.remove('hidden');
            emptyState.classList.add('hidden');

            books.forEach(book => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-lg border border-gray-200 shadow-sm overflow-hidden flex flex-col card-hover transition duration-300";
                
                // Kitob nomini tozalash (agar kerak bo'lsa) va kengaytmani olib tashlash
                let cleanName = book.fileName.replace(/\.(pdf|doc|docx|djvu)$/i, '');

                card.innerHTML = `
                    <div class="p-5 flex-grow">
                        <div class="text-xs font-semibold text-indigo-500 mb-2 uppercase tracking-wider">
                            <i class="fa-regular fa-folder mr-1"></i> ${book.folder}
                        </div>
                        <h3 class="text-md font-bold text-gray-800 mb-3 truncate-2-lines" title="${cleanName}">
                            ${cleanName}
                        </h3>
                    </div>
                    <div class="px-5 py-4 bg-gray-50 border-t border-gray-100 mt-auto">
                        <a href="${book.url}" target="_blank" class="block w-full text-center bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded transition duration-200">
                            <i class="fa-solid fa-cloud-arrow-down mr-2"></i> Yuklab olish
                        </a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Qidiruv va Filtr
        function filterBooks() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            const filtered = allBooks.filter(book => {
                const matchCategory = currentCategory === 'Barchasi' || book.folder === currentCategory;
                const matchSearch = book.fileName.toLowerCase().includes(searchTerm) || 
                                    (book.folder && book.folder.toLowerCase().includes(searchTerm));
                return matchCategory && matchSearch;
            });

            renderBooks(filtered);
        }

        document.getElementById('searchInput').addEventListener('input', filterBooks);

        // Ilova yuklanganda
        window.addEventListener('DOMContentLoaded', fetchBooks);
    </script>
</body>
</html>
